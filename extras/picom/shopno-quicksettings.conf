# picom rules for Shopno Quick Settings
#
# Shopno Quick Settings sets its window role to "shopno-quicksettings-blur" when blur is
# turned on in its properties, and to "shopno-quicksettings" otherwise.
#
# 1. Turn off the Xfce compositor (Settings > Window Manager Tweaks >
#    Compositor) so it does not run alongside picom.
#
# 2. Choose a blur method at the top level of ~/.config/picom/picom.conf:
#
#      blur-method = "dual_kawase";
#      blur-strength = 5;
#
# 3. Add the rules below for your picom version.
#
# 4. Turn on "Blur the background behind the flyout" in the plugin's
#    properties.


# picom 12 and newer: add these entries to your `rules` list.

rules = (
  # Blur off: the flyout draws its own rounded corners and shadow
  { match = "window_role = 'shopno-quicksettings'"; blur-background = false; shadow = false; corner-radius = 0; },

  # Blur on: picom blurs, rounds, and shadows the flyout
  { match = "window_role = 'shopno-quicksettings-blur'"; blur-background = true; shadow = true; corner-radius = 8; },
);


# picom 10 and 11 do not support `rules`. Use these options instead,
# merging them with any existing lists of the same name:
#
#   blur-background-exclude = [ "window_role = 'shopno-quicksettings'" ];
#   shadow-exclude = [ "window_role = 'shopno-quicksettings'" ];
#   rounded-corners-exclude = [ "window_role = 'shopno-quicksettings'" ];
#   corner-radius-rules = [ "8:window_role = 'shopno-quicksettings-blur'" ];
