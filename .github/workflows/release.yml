name: Release

# Releases only come from main: when a pull request from release/<version>
# is merged, this builds the packages from the merge commit and attaches
# them to a draft release tagged v<version>, to be checked and published
# by hand. Publishing the draft creates the tag.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  check:
    name: Check release branch
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - id: version
        name: Match the branch with meson.build
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version=$(sed -n "s/^ *version: '\(.*\)',$/\1/p" meson.build | head -1)
          if [ "$BRANCH" != "release/$version" ]; then
            echo "::error::Branch $BRANCH does not match version $version in meson.build"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  packages:
    name: Packages
    needs: check
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  release:
    name: Draft release
    needs: [check, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          # GitHub replaces "~" in uploaded file names with ".", so rename
          # first to keep SHA256SUMS matching the downloads
          shopt -s nullglob
          for file in *~*; do
            mv "$file" "${file//\~/.}"
          done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: Shopno Quick Settings ${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: dist/*
